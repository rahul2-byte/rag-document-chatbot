<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document Q&amp;A</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2316191b'/%3E%3Cpath d='M10 9h9l4 4v10H10z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/static/chat.css">
</head>
<body>
  <div class="app is-empty" id="app">
    <header class="top">
      <div class="top-l">
        <h1 class="brand-name">Document Q&amp;A</h1>
        <span class="pill" id="pill" hidden></span>
      </div>
      <button class="icon-btn" id="new-chat" type="button" aria-label="New chat" title="New chat">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      </button>
    </header>

    <main class="main">
      <div class="scroll" id="scroll">
        <div class="col">
          <section class="hero" id="hero">
            <h2>Ask your documents</h2>
            <p id="scope">Checking the library&hellip;</p>
          </section>
          <ol class="messages" id="messages" aria-live="polite"></ol>
        </div>
      </div>


      <div class="dock">
        <button class="to-bottom" id="to-bottom" type="button" aria-label="Scroll to latest message" hidden>
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
        </button>
        <div class="col">
          <div class="suggest" id="examples" role="group" aria-label="Example questions"></div>
          <form class="composer" id="form">
            <label class="sr-only" for="q">Your question</label>
            <textarea id="q" rows="1" placeholder="Ask a question about the documents"></textarea>
            <span class="count" id="count" aria-live="polite" hidden></span>
            <button class="send" id="send" type="submit" aria-label="Send question" disabled>
              <svg class="icon" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </form>
          <div class="hint-row">
            <div class="seg" role="radiogroup" aria-label="Answer length">
              <label title="Thorough answers that explain each point"><input type="radio" name="detail" value="detailed" id="detail-detailed" checked><span>Detailed</span></label>
              <label title="Short, direct answers"><input type="radio" name="detail" value="brief" id="detail-brief"><span>Brief</span></label>
            </div>
            <p class="hint">Answers come only from your documents and cite their sources.</p>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="/static/chat.js"></script>
</body>
</html>
