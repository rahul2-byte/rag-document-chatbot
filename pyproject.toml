[project]
name = "rag-demo"
version = "0.1.0"
description = "Small RAG chatbot demo: cited answers from local documents"
requires-python = ">=3.11"
dependencies = [
    "anthropic==1.17.0",
    "openai==3.16.2",
    "pypdf==6.19.0",
    "sentence-transformers==6.0.1",
    "torch==2.15.0",
    "numpy",
    "faiss-cpu==1.16.0",
    "fastapi==0.162.4",
    "uvicorn==0.54.0",
    "python-multipart==0.0.33",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
